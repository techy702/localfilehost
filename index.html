<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Local Media Host</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        .scene-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #ccc;
            background: #f5f5f5;
        }
        
        .media-element {
            position: absolute;
            border: 2px solid transparent;
            cursor: move;
        }
        
        .selected {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
        
        .controls {
            margin: 10px 0;
        }
        
        button {
            padding: 8px 12px;
            cursor: pointer;
            margin: 5px;
        }
        
        .file-drop-zone {
            border: 2px dashed #ccc;
            padding: 20px;
            text-align: center;
            cursor: pointer;
        }
        
        .drag-over {
            border-color: #007bff;
            background: rgba(0, 123, 255, 0.1);
        }
    </style>
</head>
<body>
    <h1>Local Media Host</h1>
    
    <div class="controls">
        <button onclick="addMediaElement()">Add Video</button>
        <button onclick="addImageButton()">Add Image</button>
        <button onclick="addText()">Add Text</button>
        <button onclick="clearScene()">Clear Scene</button>
    </div>
    
    <div id="fileDropZone" class="file-drop-zone">
        <p>Drag files here or onto the canvas, or click here to choose files</p>
        <input type="file" id="fileInput" style="display: none;" multiple accept="image/*,video/*,audio/*,application/pdf,text/*,.md,.json,.csv,.log">
    </div>
    
    <div class="scene-container" id="sceneContainer">
        <!-- Media elements will be added here -->
    </div>
    
    <script>
        const sceneContainer = document.getElementById('sceneContainer');
        const dropZone = document.getElementById('fileDropZone');
        const fileInput = document.getElementById('fileInput');
        
        let selectedElement = null;
        let placedCount = 0;
        let objectUrls = [];
        
        // Decide what kind of media a file is (by MIME type, falling back to extension)
        function kindOf(file) {
            const type = file.type || '';
            const name = file.name.toLowerCase();
            if (type.startsWith('image/')) return 'image';
            if (type.startsWith('video/')) return 'video';
            if (type.startsWith('audio/')) return 'audio';
            if (type === 'application/pdf' || name.endsWith('.pdf')) return 'pdf';
            if (type.startsWith('text/') || /\.(txt|md|json|csv|log)$/.test(name)) return 'text';
            return null;
        }
        
        // ---- Drag and drop / file picker ----
        
        [dropZone, sceneContainer].forEach(function(target) {
            target.addEventListener('dragover', function(e) {
                e.preventDefault();
                target.classList.add('drag-over');
            });
            
            target.addEventListener('dragleave', function() {
                target.classList.remove('drag-over');
            });
            
            target.addEventListener('drop', function(e) {
                e.preventDefault();
                target.classList.remove('drag-over');
                // Dropping on the canvas places media at the cursor
                let pos = null;
                if (target === sceneContainer) {
                    const rect = sceneContainer.getBoundingClientRect();
                    pos = {
                        x: e.clientX - rect.left - sceneContainer.clientLeft,
                        y: e.clientY - rect.top - sceneContainer.clientTop
                    };
                }
                handleFiles(e.dataTransfer.files, pos);
            });
        });
        
        // Clicking the drop zone opens the file picker
        dropZone.addEventListener('click', function() {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', function(e) {
            handleFiles(e.target.files, null);
            fileInput.value = ''; // allow choosing the same file again
        });
        
        function handleFiles(files, pos) {
            Array.from(files).forEach(function(file, i) {
                // Offset multiple files dropped together so they don't stack exactly
                const p = pos ? { x: pos.x + i * 20, y: pos.y + i * 20 } : null;
                const url = URL.createObjectURL(file);
                objectUrls.push(url);
                switch (kindOf(file)) {
                    case 'image': addImage(url, p); break;
                    case 'video': addVideo(url, p); break;
                    case 'audio': addAudio(url, p); break;
                    case 'pdf': addPdf(url, p); break;
                    case 'text': addTextFile(file, p); break;
                }
            });
        }
        
        // ---- Element creation ----
        
        // Scale natural media size down to fit the canvas, keeping aspect ratio.
        // Media smaller than the canvas keeps its natural size.
        function fitToScene(w, h) {
            const scale = Math.min(1,
                sceneContainer.clientWidth / w,
                sceneContainer.clientHeight / h);
            return { w: Math.round(w * scale), h: Math.round(h * scale) };
        }
        
        // Create the element, size it, and place it (centered on pos, or cascaded)
        function addElement(content, w, h, pos) {
            const element = document.createElement('div');
            element.className = 'media-element';
            element.style.width = w + 'px';
            element.style.height = h + 'px';
            element.appendChild(content);
            sceneContainer.appendChild(element);
            
            let left, top;
            if (pos) {
                left = pos.x - element.offsetWidth / 2;
                top = pos.y - element.offsetHeight / 2;
            } else {
                const step = (placedCount++ % 10) * 20;
                left = 10 + step;
                top = 10 + step;
            }
            moveElement(element, left, top);
            makeDraggable(element);
            return element;
        }
        
        // Position an element, keeping it inside the canvas
        function moveElement(element, left, top) {
            const maxLeft = sceneContainer.clientWidth - element.offsetWidth;
            const maxTop = sceneContainer.clientHeight - element.offsetHeight;
            element.style.left = Math.max(0, Math.min(left, maxLeft)) + 'px';
            element.style.top = Math.max(0, Math.min(top, maxTop)) + 'px';
        }
        
        function fillStyle(el) {
            el.style.width = '100%';
            el.style.height = '100%';
            el.style.objectFit = 'contain';
            el.style.display = 'block';
        }
        
        function addImage(src, pos) {
            const img = document.createElement('img');
            fillStyle(img);
            img.draggable = false; // let our own drag handling win over the browser's image drag
            img.onload = function() {
                const s = fitToScene(img.naturalWidth || 200, img.naturalHeight || 150);
                addElement(img, s.w, s.h, pos);
            };
            img.onerror = function() { addElement(img, 200, 150, pos); };
            img.src = src;
        }
        
        function addVideo(src, pos) {
            const video = document.createElement('video');
            fillStyle(video);
            video.controls = true;
            video.preload = 'metadata';
            video.onloadedmetadata = function() {
                const s = fitToScene(video.videoWidth || 320, video.videoHeight || 240);
                addElement(video, s.w, s.h, pos);
            };
            video.onerror = function() { addElement(video, 320, 240, pos); };
            video.src = src;
        }
        
        function addAudio(src, pos) {
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.style.width = '100%';
            audio.style.display = 'block';
            audio.src = src;
            addElement(audio, 320, 54, pos);
        }
        
        function addPdf(src, pos) {
            const frame = document.createElement('iframe');
            frame.src = src;
            frame.style.width = '100%';
            frame.style.height = '100%';
            frame.style.border = '0';
            addElement(frame, 360, 480, pos);
        }
        
        function addTextFile(file, pos) {
            const pre = document.createElement('pre');
            pre.style.margin = '0';
            pre.style.padding = '8px';
            pre.style.boxSizing = 'border-box';
            pre.style.width = '100%';
            pre.style.height = '100%';
            pre.style.overflow = 'auto';
            pre.style.background = '#fff';
            pre.style.whiteSpace = 'pre-wrap';
            file.text().then(function(text) {
                pre.textContent = text;
                addElement(pre, 320, 240, pos);
            });
        }
        
        // Sample video from URL (toolbar button)
        function addMediaElement() {
            addVideo('https://sample-videos.com/video123/mp4/768x432_1mb.mp4', null);
        }
        
        // Placeholder image (toolbar button)
        function addImageButton() {
            addImage('https://placehold.co/200x150', null);
        }
        
        // Text box (toolbar button)
        function addText() {
            const box = document.createElement('div');
            box.textContent = 'Sample Text';
            box.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;' +
                'justify-content:center;background:#e9ecef;color:black;font:16px Arial;text-align:center;';
            addElement(box, 200, 150, null);
        }
        
        // ---- Dragging ----
        
        function makeDraggable(element) {
            let offsetX = 0, offsetY = 0;
            
            element.addEventListener('mousedown', function(e) {
                // Remove selection from all elements, then select this one
                document.querySelectorAll('.media-element').forEach(el => {
                    el.classList.remove('selected');
                });
                
                selectedElement = element;
                element.classList.add('selected');
                
                // Remember where inside the element the mouse grabbed it
                const rect = element.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                
                document.addEventListener('mousemove', dragElement);
                document.addEventListener('mouseup', stopDrag);
            });
            
            function dragElement(e) {
                if (!selectedElement) return;
                // Convert mouse position to canvas coordinates
                const rect = sceneContainer.getBoundingClientRect();
                moveElement(selectedElement,
                    e.clientX - offsetX - rect.left - sceneContainer.clientLeft,
                    e.clientY - offsetY - rect.top - sceneContainer.clientTop);
            }
            
            function stopDrag() {
                document.removeEventListener('mousemove', dragElement);
                document.removeEventListener('mouseup', stopDrag);
            }
        }
        
        // Clear scene
        function clearScene() {
            sceneContainer.innerHTML = '';
            selectedElement = null;
            placedCount = 0;
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls = [];
        }
    </script>
</body>
</html>
